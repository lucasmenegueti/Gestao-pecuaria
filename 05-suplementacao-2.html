<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suplementacao - Passo 2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone-frame">

    <div class="header">
      <a href="05-suplementacao-1.html" class="back-btn">&#x2190;</a>
      <h1>SUPLEMENTACAO</h1>
      <span class="step-indicator">2 de 8</span>
    </div>

    <div class="content" style="padding-bottom: 120px;">

      <div class="wizard-question">VOCE ABASTECEU O COCHO?</div>

      <div class="binary-row">
        <button class="binary-btn yes selected">
          <span class="icon">&#x2705;</span>
          SIM
        </button>
        <button class="binary-btn no">
          <span class="icon">&#x274C;</span>
          NAO
        </button>
      </div>

      <p class="text-muted text-center fs-14 mt-16">
        Se SIM, voce informara a formulacao e quantidade.<br>
        Se NAO, pula direto para bombona e acesso ao cocho.
      </p>

    </div>

    <div class="wizard-footer">
      <a href="05-suplementacao-1.html" class="btn btn-secondary">&#x2190; VOLTAR</a>
      <a href="05-suplementacao-3.html" class="btn btn-primary">AVANCAR &#x2192;</a>
    </div>

  </div>
</body>
</html>
