<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aguada - Passo 2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone-frame">
    <div class="header">
      <a href="07-aguada-1.html" class="back-btn">&#x2190;</a>
      <h1>AGUADA</h1>
      <span class="step-indicator">2 de 3</span>
    </div>
    <div class="content" style="padding-bottom: 120px;">
      <div class="wizard-question">QUAL A QUALIDADE DA AGUA?</div>
      <button class="choice-option green selected">
        <span class="icon">&#x1F7E2;</span>
        <div>
          EXCELENTE
          <div class="desc">Agua limpida, sem cheiro, sem cor, sem residuos</div>
        </div>
      </button>
      <button class="choice-option green">
        <span class="icon">&#x1F7E2;</span>
        <div>
          BOA
          <div class="desc">Agua sem cheiro, sem residuos</div>
        </div>
      </button>
      <button class="choice-option yellow">
        <span class="icon">&#x1F7E1;</span>
        <div>
          MEDIANA
          <div class="desc">Agua turva, sem cheiro</div>
        </div>
      </button>
      <button class="choice-option red">
        <span class="icon">&#x1F534;</span>
        <div>
          RUIM
          <div class="desc">Agua suja</div>
        </div>
      </button>
    </div>
    <div class="wizard-footer">
      <a href="07-aguada-1.html" class="btn btn-secondary">&#x2190; VOLTAR</a>
      <a href="07-aguada-3.html" class="btn btn-primary">AVANCAR &#x2192;</a>
    </div>
  </div>
</body>
</html>
