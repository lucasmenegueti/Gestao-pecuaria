<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suplementacao - Passo 3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone-frame">

    <div class="header">
      <a href="05-suplementacao-2.html" class="back-btn">&#x2190;</a>
      <h1>SUPLEMENTACAO</h1>
      <span class="step-indicator">3 de 8</span>
    </div>

    <div class="content" style="padding-bottom: 120px;">

      <div class="wizard-question">QUAL FORMULACAO?</div>

      <button class="choice-option selected">
        <div>
          <strong>PROBEEF REPRODUCAO</strong>
          <div class="desc">25 kg/saco &bull; 100 g/cab/dia</div>
        </div>
      </button>

      <button class="choice-option">
        <div>
          <strong>ENGORDA 3 KG</strong>
          <div class="desc">25 kg/saco &bull; 3.000 g/cab/dia</div>
        </div>
      </button>

      <button class="choice-option">
        <div>
          <strong>RECRIA TOP MOST</strong>
          <div class="desc">25 kg/saco &bull; 200 g/cab/dia</div>
        </div>
      </button>

      <button class="choice-option">
        <div>
          <strong>SAL MINERAL</strong>
          <div class="desc">30 kg/saco &bull; 80 g/cab/dia</div>
        </div>
      </button>

      <button class="choice-option">
        <div>
          <strong>PROTEINADO SECO</strong>
          <div class="desc">25 kg/saco &bull; 150 g/cab/dia</div>
        </div>
      </button>

    </div>

    <div class="wizard-footer">
      <a href="05-suplementacao-2.html" class="btn btn-secondary">&#x2190; VOLTAR</a>
      <a href="05-suplementacao-4.html" class="btn btn-primary">AVANCAR &#x2192;</a>
    </div>

  </div>
</body>
</html>
