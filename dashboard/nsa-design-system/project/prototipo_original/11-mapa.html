<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa da Fazenda</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone-frame">
    <div class="header">
      <h1>Mapa da Fazenda</h1>
      <span>&#x1F4E1;</span>
    </div>
    <div class="content">

      <!-- Fake map -->
      <div style="background: #2d4a2d; border-radius: 16px; padding: 20px; min-height: 400px; position: relative; overflow: hidden;">
        <!-- Satellite texture simulation -->
        <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, #2d4a2d 0%, #3a5a3a 25%, #2d4a2d 50%, #3a5a3a 75%, #2d4a2d 100%); opacity: 0.8;"></div>

        <!-- Paddock polygons -->
        <div style="position: relative; z-index: 1;">
          <!-- Pasto 14 - OK -->
          <div style="position: absolute; top: 20px; left: 20px; width: 120px; height: 80px; background: rgba(45,138,78,0.4); border: 2px solid #2d8a4e; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; cursor: pointer;">
            14<br><span style="font-size: 11px;">85 cab</span>
          </div>

          <!-- Pasto 14A - OK -->
          <div style="position: absolute; top: 30px; left: 160px; width: 140px; height: 90px; background: rgba(45,138,78,0.4); border: 2px solid #2d8a4e; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; cursor: pointer;">
            14A<br><span style="font-size: 11px;">72 cab</span>
          </div>

          <!-- Pasto 15 - ALERTA -->
          <div style="position: absolute; top: 120px; left: 30px; width: 100px; height: 70px; background: rgba(192,57,43,0.4); border: 2px solid #c0392b; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; cursor: pointer;">
            15<br><span style="font-size: 11px;">65 cab</span>
          </div>

          <!-- Pasto 16 - Atencao -->
          <div style="position: absolute; top: 140px; left: 150px; width: 130px; height: 80px; background: rgba(230,126,34,0.4); border: 2px solid #e67e22; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; cursor: pointer;">
            16<br><span style="font-size: 11px;">110 cab</span>
          </div>

          <!-- Pasto 17 -->
          <div style="position: absolute; top: 240px; left: 40px; width: 90px; height: 90px; background: rgba(45,138,78,0.4); border: 2px solid #2d8a4e; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; cursor: pointer;">
            17<br><span style="font-size: 11px;">55 cab</span>
          </div>

          <!-- Pasto 18 -->
          <div style="position: absolute; top: 230px; left: 150px; width: 140px; height: 70px; background: rgba(45,138,78,0.4); border: 2px solid #2d8a4e; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px; cursor: pointer;">
            18<br><span style="font-size: 11px;">95 cab</span>
          </div>

          <!-- GPS marker -->
          <div style="position: absolute; top: 180px; left: 100px; font-size: 24px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));">&#x1F4CD;</div>
          <div style="position: absolute; top: 205px; left: 88px; color: white; font-size: 11px; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,0.8);">Voce esta aqui</div>
        </div>
      </div>

      <!-- Legend -->
      <div class="card mt-16">
        <div class="fw-bold mb-8">Legenda</div>
        <div style="display: flex; gap: 16px; flex-wrap: wrap;">
          <div style="display: flex; align-items: center; gap: 4px;">
            <div style="width: 16px; height: 16px; background: rgba(45,138,78,0.6); border: 2px solid #2d8a4e; border-radius: 3px;"></div>
            <span class="fs-14">OK</span>
          </div>
          <div style="display: flex; align-items: center; gap: 4px;">
            <div style="width: 16px; height: 16px; background: rgba(230,126,34,0.6); border: 2px solid #e67e22; border-radius: 3px;"></div>
            <span class="fs-14">Atencao</span>
          </div>
          <div style="display: flex; align-items: center; gap: 4px;">
            <div style="width: 16px; height: 16px; background: rgba(192,57,43,0.6); border: 2px solid #c0392b; border-radius: 3px;"></div>
            <span class="fs-14">Alerta</span>
          </div>
        </div>
      </div>

      <a href="#" class="btn btn-secondary mt-16">&#x270F;&#xFE0F; Editar Piquetes</a>

    </div>

    <!-- Tab bar -->
    <div class="tab-bar">
      <a href="02-dashboard.html" class="tab-item"><span class="tab-icon">&#x1F4CA;</span>Painel</a>
      <a href="03-ronda-piquetes.html" class="tab-item"><span class="tab-icon">&#x1F6B6;</span>Ronda</a>
      <a href="12-rebanho.html" class="tab-item"><span class="tab-icon">&#x1F402;</span>Rebanho</a>
      <a href="13-estoque.html" class="tab-item"><span class="tab-icon">&#x1F4E6;</span>Estoque</a>
      <a href="11-mapa.html" class="tab-item active"><span class="tab-icon">&#x1F5FA;&#xFE0F;</span>Mapa</a>
    </div>
  </div>
</body>
</html>
