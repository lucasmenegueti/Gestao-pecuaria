<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forragem - Resultado</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone-frame">
    <div class="header">
      <a href="06-forragem-5.html" class="back-btn">&#x2190;</a>
      <h1>FORRAGEM</h1>
      <span class="step-indicator">6 de 6</span>
    </div>
    <div class="content">
      <div class="wizard-question">RESULTADO DA MEDICAO</div>
      <p class="text-muted mb-16">Pasto 14 &bull; ENTRADA &bull; Braquiarao</p>

      <div class="summary-box">
        <div class="summary-row">
          <span class="summary-label">1&#xAA; medida</span>
          <span class="summary-value">35 cm</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">2&#xAA; medida</span>
          <span class="summary-value">42 cm</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">3&#xAA; medida</span>
          <span class="summary-value">38 cm</span>
        </div>
      </div>

      <div class="result-big danger">
        <div class="value">38,3 cm</div>
        <div class="label">MEDIA</div>
      </div>

      <div class="card" style="text-align: center; border: 2px solid var(--danger);">
        <div style="font-size: 24px;">&#x1F534; FORA DO DESEJADO</div>
        <div class="text-muted mt-8">Entrada ideal para Braquiarao: &#x2265;40 cm</div>
        <div class="text-muted">Media registrada: 38,3 cm</div>
      </div>

      <div class="summary-box mt-16">
        <div class="summary-row">
          <span class="summary-label">Qualidade</span>
          <span class="summary-value"><span class="badge warning">&#x1F7E1; REGULAR</span></span>
        </div>
      </div>

      <button class="photo-btn">&#x1F4F7; Adicionar foto (opcional)</button>

      <a href="04-menu-avaliacao.html" class="btn btn-success" style="font-size: 20px;">
        &#x2705; FINALIZAR
      </a>
    </div>
  </div>
</body>
</html>
