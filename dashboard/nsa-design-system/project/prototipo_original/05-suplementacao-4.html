<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suplementacao - Passo 4</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone-frame">

    <div class="header">
      <a href="05-suplementacao-3.html" class="back-btn">&#x2190;</a>
      <h1>SUPLEMENTACAO</h1>
      <span class="step-indicator">4 de 8</span>
    </div>

    <div class="content" style="padding-bottom: 120px;">

      <div class="wizard-question">QUANTOS SACOS COLOCOU NO COCHO?</div>

      <div class="slider-container">
        <span class="slider-value">5.0</span>
        <span class="slider-unit">sacos</span>
      </div>

      <div class="slider-row">
        <button class="slider-btn">-</button>
        <div class="slider-track">
          <div class="slider-fill" style="width: 2.5%;"></div>
        </div>
        <button class="slider-btn">+</button>
      </div>
      <div class="slider-labels">
        <span>0.5</span>
        <span>200</span>
      </div>

      <div class="card mt-24" style="text-align: center;">
        <div class="text-muted fs-14">Formulacao selecionada</div>
        <div class="fw-bold">PROBEEF REPRODUCAO</div>
        <div class="text-muted fs-14">5.0 sacos &times; 25 kg = <strong>125 kg</strong></div>
      </div>

    </div>

    <div class="wizard-footer">
      <a href="05-suplementacao-3.html" class="btn btn-secondary">&#x2190; VOLTAR</a>
      <a href="05-suplementacao-5.html" class="btn btn-primary">AVANCAR &#x2192;</a>
    </div>

  </div>
</body>
</html>
