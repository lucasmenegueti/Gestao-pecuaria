<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suplementacao - Passo 6</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone-frame">

    <div class="header">
      <a href="05-suplementacao-5.html" class="back-btn">&#x2190;</a>
      <h1>SUPLEMENTACAO</h1>
      <span class="step-indicator">6 de 8</span>
    </div>

    <div class="content" style="padding-bottom: 120px;">

      <div class="wizard-question">QUANTOS SACOS TEM NA BOMBONA?</div>

      <div class="slider-container">
        <span class="slider-value">8</span>
        <span class="slider-unit">sacos</span>
      </div>

      <div class="slider-row">
        <button class="slider-btn">-</button>
        <div class="slider-track">
          <div class="slider-fill" style="width: 8%;"></div>
        </div>
        <button class="slider-btn">+</button>
      </div>
      <div class="slider-labels">
        <span>0</span>
        <span>100</span>
      </div>

      <div class="card mt-24" style="background: var(--success-bg); text-align: center;">
        <div class="text-success fw-bold">Bombona com reserva</div>
        <div class="fs-14">8 sacos = 200 kg de PROBEEF REPRODUCAO</div>
      </div>

    </div>

    <div class="wizard-footer">
      <a href="05-suplementacao-5.html" class="btn btn-secondary">&#x2190; VOLTAR</a>
      <a href="05-suplementacao-7.html" class="btn btn-primary">AVANCAR &#x2192;</a>
    </div>

  </div>
</body>
</html>
