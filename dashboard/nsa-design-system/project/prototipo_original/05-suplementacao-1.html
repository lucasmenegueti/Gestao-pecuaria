<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suplementacao - Passo 1</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone-frame">

    <div class="header">
      <a href="04-menu-avaliacao.html" class="back-btn">&#x2190;</a>
      <h1>SUPLEMENTACAO</h1>
      <span class="step-indicator">1 de 8</span>
    </div>

    <div class="content" style="padding-bottom: 120px;">

      <div class="wizard-question">COMO ESTA O COCHO?</div>

      <button class="choice-option green selected" onclick="this.classList.toggle('selected')">
        <span class="icon">&#x1F7E2;</span>
        <div>
          CHEIO
          <div class="desc">Cocho com bastante suplemento</div>
        </div>
      </button>

      <button class="choice-option yellow" onclick="this.classList.toggle('selected')">
        <span class="icon">&#x1F7E1;</span>
        <div>
          ADEQUADA
          <div class="desc">Consumo normal, quantidade ok</div>
        </div>
      </button>

      <button class="choice-option red" onclick="this.classList.toggle('selected')">
        <span class="icon">&#x1F534;</span>
        <div>
          VAZIO
          <div class="desc">Cocho sem suplemento</div>
        </div>
      </button>

    </div>

    <div class="wizard-footer">
      <a href="04-menu-avaliacao.html" class="btn btn-secondary">&#x2190; VOLTAR</a>
      <a href="05-suplementacao-2.html" class="btn btn-primary">AVANCAR &#x2192;</a>
    </div>

  </div>
</body>
</html>
