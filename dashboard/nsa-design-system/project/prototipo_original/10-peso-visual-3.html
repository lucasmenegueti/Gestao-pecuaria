<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peso Visual - Resumo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone-frame">
    <div class="header">
      <a href="10-peso-visual-2.html" class="back-btn">&#x2190;</a>
      <h1>PESO VISUAL</h1>
      <span class="step-indicator">3 de 3</span>
    </div>
    <div class="content">
      <div class="wizard-question">RESUMO PESO VISUAL</div>
      <p class="text-muted mb-16">Pasto 14 &bull; GARROTE &bull; 45 cabecas</p>

      <div class="summary-box">
        <div class="summary-row">
          <span class="summary-label">Categoria</span>
          <span class="summary-value">GARROTE</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Peso anterior</span>
          <span class="summary-value">320 kg</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Peso novo</span>
          <span class="summary-value" style="font-size: 22px;">350 kg</span>
        </div>
      </div>

      <div class="result-big ok">
        <div class="value" style="font-size: 36px;">+30 kg</div>
        <div class="label">+9,4% de ganho</div>
        <div class="fs-14 mt-8">Em 8 dias (desde 01/04)</div>
      </div>

      <button class="photo-btn">&#x1F4F7; Adicionar foto (opcional)</button>
      <a href="04-menu-avaliacao.html" class="btn btn-success" style="font-size: 20px;">&#x2705; FINALIZAR</a>
    </div>
  </div>
</body>
</html>
