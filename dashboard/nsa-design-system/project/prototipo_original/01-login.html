<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Gestao Pecuaria NSA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone-frame">

    <div style="padding: 60px 20px 20px; text-align: center;">
      <div style="font-size: 64px; margin-bottom: 16px;">&#x1F402;</div>
      <h1 style="font-size: 28px; color: var(--primary); font-weight: 800;">GESTAO PECUARIA</h1>
      <p style="font-size: 16px; color: var(--text-muted); margin-top: 4px;">Fazenda Nossa Senhora Aparecida</p>
    </div>

    <div class="content" style="padding-top: 32px;">
      <div class="input-group">
        <label class="input-label">&#x1F464; Usuario</label>
        <input type="text" class="input-field" placeholder="Digite seu usuario" value="joao.peao">
      </div>

      <div class="input-group">
        <label class="input-label">&#x1F512; Senha</label>
        <input type="password" class="input-field" placeholder="Digite sua senha" value="********">
      </div>

      <div style="display: flex; align-items: center; gap: 8px; margin: 16px 0;">
        <input type="checkbox" id="remember" checked style="width: 22px; height: 22px;">
        <label for="remember" style="font-size: 16px;">Lembrar de mim</label>
      </div>

      <a href="02-dashboard.html" class="btn btn-primary" style="margin-top: 24px;">
        ENTRAR
      </a>

      <p style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted);">
        &#x1F4E1; Primeiro acesso requer internet
      </p>
    </div>

  </div>
</body>
</html>
