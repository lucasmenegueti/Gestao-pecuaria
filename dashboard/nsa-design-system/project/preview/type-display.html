<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.hero { font-family: 'Inter', sans-serif; font-size: 72px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: var(--fg); margin-bottom: 4px; }
.sub { font-size: 14px; color: var(--fg-muted); font-family: var(--font-mono); }
.weights { display: flex; gap: 24px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border-subtle); }
.w { font-size: 22px; color: var(--fg); }
.wl { display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-muted); margin-top: 4px; font-weight: 500; }
</style></head>
<body><div class="card">
  <div class="hero">Inter</div>
  <div class="sub">rsms.me/inter — variable · tabular nums · ss01</div>
  <div class="weights">
    <div><div class="w" style="font-weight:400">Aa 123</div><span class="wl">Regular 400</span></div>
    <div><div class="w" style="font-weight:500">Aa 123</div><span class="wl">Medium 500</span></div>
    <div><div class="w" style="font-weight:600">Aa 123</div><span class="wl">Semibold 600</span></div>
    <div><div class="w" style="font-weight:400;font-variant-numeric:tabular-nums">1 234 567</div><span class="wl">Tabular nums</span></div>
  </div>
</div></body></html>
