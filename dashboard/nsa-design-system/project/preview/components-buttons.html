<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.btn { font: 500 13px/1 'Inter', sans-serif; padding: 9px 14px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 150ms; }
.btn-primary { background: #172514; color: #FFFFE3; }
.btn-primary:hover { background: #0c1609; }
.btn-secondary { background: #fff; color: #1f1f1c; border-color: #d2d2cd; }
.btn-secondary:hover { background: #f7f7f5; border-color: #a8a8a2; }
.btn-ghost { background: transparent; color: #1f1f1c; }
.btn-ghost:hover { background: #efefec; }
.btn-danger { background: #fff; color: #c0392b; border-color: #d2d2cd; }
.btn-sm { padding: 6px 10px; font-size: 12px; }
.btn-lg { padding: 12px 18px; font-size: 14px; }
.label { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 10px; }
</style></head>
<body><div class="card">
  <div class="label">Buttons</div>
  <div class="row">
    <button class="btn btn-primary">Aprovar pagamento</button>
    <button class="btn btn-secondary">Cancelar</button>
    <button class="btn btn-ghost">Ver detalhes</button>
    <button class="btn btn-danger">Excluir</button>
  </div>
  <div class="row">
    <button class="btn btn-primary btn-sm">Salvar</button>
    <button class="btn btn-primary">Salvar</button>
    <button class="btn btn-primary btn-lg">Salvar</button>
    <button class="btn btn-secondary" disabled style="opacity:0.5;cursor:not-allowed">Desabilitado</button>
  </div>
</div></body></html>
