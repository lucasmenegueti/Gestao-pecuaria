<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.row { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 16px; }
.tk { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.box { background: var(--nsa-green-800); border-radius: 2px; }
.name { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-muted); }
.px { font-family: var(--font-mono); font-size: 9.5px; color: var(--fg-subtle); }
.scale-label { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 4px; }
</style></head>
<body><div class="card">
  <div class="scale-label">Spacing — 4px base</div>
  <div class="row">
    <div class="tk"><div class="box" style="width:4px;height:4px"></div><div class="name">sp-1</div><div class="px">4</div></div>
    <div class="tk"><div class="box" style="width:8px;height:8px"></div><div class="name">sp-2</div><div class="px">8</div></div>
    <div class="tk"><div class="box" style="width:12px;height:12px"></div><div class="name">sp-3</div><div class="px">12</div></div>
    <div class="tk"><div class="box" style="width:16px;height:16px"></div><div class="name">sp-4</div><div class="px">16</div></div>
    <div class="tk"><div class="box" style="width:20px;height:20px"></div><div class="name">sp-5</div><div class="px">20</div></div>
    <div class="tk"><div class="box" style="width:24px;height:24px"></div><div class="name">sp-6</div><div class="px">24</div></div>
    <div class="tk"><div class="box" style="width:32px;height:32px"></div><div class="name">sp-8</div><div class="px">32</div></div>
    <div class="tk"><div class="box" style="width:40px;height:40px"></div><div class="name">sp-10</div><div class="px">40</div></div>
    <div class="tk"><div class="box" style="width:48px;height:48px"></div><div class="name">sp-12</div><div class="px">48</div></div>
    <div class="tk"><div class="box" style="width:64px;height:64px"></div><div class="name">sp-16</div><div class="px">64</div></div>
  </div>
</div></body></html>
