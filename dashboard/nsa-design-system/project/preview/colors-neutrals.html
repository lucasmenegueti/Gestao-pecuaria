<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.row { display: flex; gap: 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
.sw { flex: 1; padding: 16px 12px; min-height: 92px; display: flex; flex-direction: column; justify-content: space-between; font-size: 11px; }
.sw .name { font-weight: 600; font-size: 12px; }
.sw .hex { font-family: var(--font-mono); font-size: 10.5px; opacity: 0.8; }
.label { margin-bottom: 10px; }
</style></head>
<body><div class="card">
  <div class="label">Neutrals — Grafite scale</div>
  <div class="row">
    <div class="sw" style="background:#ffffff;color:#363632;border-right:1px solid var(--border)"><span class="name">0</span><span class="hex">#FFFFFF</span></div>
    <div class="sw" style="background:#fcfcfb;color:#363632"><span class="name">25</span><span class="hex">#FCFCFB</span></div>
    <div class="sw" style="background:#f7f7f5;color:#363632"><span class="name">50</span><span class="hex">#F7F7F5</span></div>
    <div class="sw" style="background:#efefec;color:#363632"><span class="name">100</span><span class="hex">#EFEFEC</span></div>
    <div class="sw" style="background:#e5e5e1;color:#363632"><span class="name">200</span><span class="hex">#E5E5E1</span></div>
    <div class="sw" style="background:#d2d2cd;color:#363632"><span class="name">300</span><span class="hex">#D2D2CD</span></div>
    <div class="sw" style="background:#a8a8a2;color:#fff"><span class="name">400</span><span class="hex">#A8A8A2</span></div>
    <div class="sw" style="background:#787873;color:#fff"><span class="name">500</span><span class="hex">#787873</span></div>
    <div class="sw" style="background:#54544f;color:#fff"><span class="name">600</span><span class="hex">#54544F</span></div>
    <div class="sw" style="background:#363632;color:#fff"><span class="name">700</span><span class="hex">#363632</span></div>
    <div class="sw" style="background:#1f1f1c;color:#fff"><span class="name">800 ★</span><span class="hex">#1F1F1C</span></div>
    <div class="sw" style="background:#0f0f0d;color:#fff"><span class="name">900</span><span class="hex">#0F0F0D</span></div>
  </div>
</div></body></html>
