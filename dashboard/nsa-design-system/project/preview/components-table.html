<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: #787873; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 10px 12px; border-bottom: 1px solid #e5e5e1; }
th.r, td.r { text-align: right; font-variant-numeric: tabular-nums; }
td { padding: 11px 12px; border-bottom: 1px solid #efefec; color: #1f1f1c; }
tr:last-child td { border-bottom: none; }
tr:nth-child(even) td { background: #fcfcfb; }
.tbl { border: 1px solid #e5e5e1; border-radius: 8px; overflow: hidden; }
.trend-up { color: #2e8c4f; font-size: 11px; font-weight: 500; }
.trend-dn { color: #c0392b; font-size: 11px; font-weight: 500; }
.label { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 10px; }
</style></head>
<body><div class="card">
  <div class="label">Tabela — densidade Linear / Stripe</div>
  <div class="tbl"><table>
    <thead><tr><th>Indicador</th><th class="r">2024/5</th><th class="r">2025/6 prev.</th><th class="r">Δ</th></tr></thead>
    <tbody>
      <tr><td>Receita agricultura</td><td class="r">R$ 22.709.656</td><td class="r">R$ 24.200.000</td><td class="r"><span class="trend-up">+6,6%</span></td></tr>
      <tr><td>Receita pecuária</td><td class="r">R$ 17.666.466</td><td class="r">R$ 18.400.000</td><td class="r"><span class="trend-up">+4,2%</span></td></tr>
      <tr><td>Estoque de dívida</td><td class="r">R$ 25.670.493</td><td class="r">R$ 19.948.661</td><td class="r"><span class="trend-dn">−22,3%</span></td></tr>
      <tr><td>Caixa final</td><td class="r">R$ 1.739.703</td><td class="r">R$ 6.774.573</td><td class="r"><span class="trend-up">+289%</span></td></tr>
    </tbody>
  </table></div>
</div></body></html>
