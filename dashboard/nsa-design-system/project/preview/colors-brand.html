<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.row { display: flex; gap: 0; align-items: stretch; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
.sw { flex: 1; padding: 16px 14px; display: flex; flex-direction: column; justify-content: space-between; min-height: 92px; font-size: 11px; letter-spacing: 0.02em; }
.sw .name { font-weight: 600; font-size: 12px; }
.sw .hex { font-family: var(--font-mono); font-size: 10.5px; opacity: 0.8; }
.label { margin-bottom: 10px; }
</style></head>
<body><div class="card">
  <div class="label">Brand — Deep Green</div>
  <div class="row">
    <div class="sw" style="background:#0c1609;color:#FFFFE3"><span class="name">green-900</span><span class="hex">#0C1609</span></div>
    <div class="sw" style="background:#172514;color:#FFFFE3"><span class="name">green-800 ★</span><span class="hex">#172514</span></div>
    <div class="sw" style="background:#1f3520;color:#FFFFE3"><span class="name">green-700</span><span class="hex">#1F3520</span></div>
    <div class="sw" style="background:#2d4a2e;color:#FFFFE3"><span class="name">green-600</span><span class="hex">#2D4A2E</span></div>
    <div class="sw" style="background:#3f6340;color:#FFFFE3"><span class="name">green-500</span><span class="hex">#3F6340</span></div>
    <div class="sw" style="background:#8ba68c;color:#0f0f0d"><span class="name">green-300</span><span class="hex">#8BA68C</span></div>
    <div class="sw" style="background:#e8ede7;color:#363632"><span class="name">green-100</span><span class="hex">#E8EDE7</span></div>
    <div class="sw" style="background:#f4f6f3;color:#363632;border-left:1px solid var(--border)"><span class="name">green-50</span><span class="hex">#F4F6F3</span></div>
  </div>
</div></body></html>
