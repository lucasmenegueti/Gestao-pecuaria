<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.row { display: flex; align-items: center; gap: 20px; }
.lockup { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 8px; }
.lockup img { height: 64px; width: auto; display: block; }
.lockup .wm { display: flex; flex-direction: column; gap: 4px; line-height: 1; }
.lockup .wm-sub { font-size: 10.5px; letter-spacing: 0.28em; text-transform: uppercase; color: inherit; opacity: 0.75; font-weight: 500; }
.lockup .wm-title { font-family: 'Lora', Georgia, serif; font-size: 22px; letter-spacing: 0.18em; color: inherit; }
.on-cream { background: #FFFFE3; color: #172514; }
.on-green { background: #172514; color: #FFFFE3; }
.on-white { background: #fff; color: #172514; border: 1px solid #e5e5e1; }
</style></head>
<body><div class="card" style="padding:16px">
  <div class="row">
    <div class="lockup on-green"><img src="../assets/logo-nsa-cream-transparent.png" alt=""><div class="wm"><span class="wm-sub">fazenda</span><span class="wm-title">N.S.A</span></div></div>
    <div class="lockup on-cream"><img src="../assets/logo-nsa-green-transparent.png" alt=""><div class="wm"><span class="wm-sub">fazenda</span><span class="wm-title">N.S.A</span></div></div>
    <div class="lockup on-white"><img src="../assets/logo-nsa-green-transparent.png" alt=""><div class="wm"><span class="wm-sub">fazenda</span><span class="wm-title">N.S.A</span></div></div>
  </div>
</div></body></html>
