<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; height: 200px; }
.ph { border-radius: 8px; background-size: cover; background-position: center; position: relative; overflow: hidden; }
.ph::after { content: attr(data-cap); position: absolute; left: 10px; bottom: 8px; color: #FFFFE3; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
</style></head>
<body><div class="card" style="padding:16px">
  <div class="grid">
    <div class="ph" style="background-image:url('../assets/photo-cornfield.jpg')" data-cap="Lavoura"></div>
    <div class="ph" style="background-image:url('../assets/photo-pasture.jpg')" data-cap="Pecuária"></div>
  </div>
</div></body></html>
