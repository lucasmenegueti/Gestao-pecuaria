[build]
  command = "npm run build"
  publish = ".next"

# Netlify auto-instala @netlify/plugin-nextjs quando detecta Next.js;
# declaramos aqui pra fixar comportamento entre CI e local.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Next 16 pede Node 20+; Node 22 é o atual LTS estável no Netlify
  NODE_VERSION = "22"

# Headers básicos de segurança pra um dashboard read-only
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
