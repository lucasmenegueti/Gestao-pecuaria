<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peso Visual - Passo 2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone-frame">
    <div class="header">
      <a href="10-peso-visual-1.html" class="back-btn">&#x2190;</a>
      <h1>PESO VISUAL</h1>
      <span class="step-indicator">2 de 3</span>
    </div>
    <div class="content" style="padding-bottom: 120px;">
      <div class="wizard-question">PESO MEDIO ESTIMADO?</div>
      <p class="text-muted mb-8">GARROTE - Pasto 14</p>
      <div class="card mb-16" style="text-align: center; background: var(--primary-light);">
        <div class="text-muted fs-14">Peso anterior</div>
        <div class="fw-bold" style="font-size: 20px;">320 kg <span class="text-muted fs-14">(01/04/2026)</span></div>
      </div>

      <div class="slider-container">
        <span class="slider-value">350</span>
        <span class="slider-unit">kg</span>
      </div>
      <div class="slider-row">
        <button class="slider-btn">-</button>
        <div class="slider-track"><div class="slider-fill" style="width: 40%;"></div></div>
        <button class="slider-btn">+</button>
      </div>
      <div class="slider-labels"><span>50 kg</span><span>800 kg</span></div>
    </div>
    <div class="wizard-footer">
      <a href="10-peso-visual-1.html" class="btn btn-secondary">&#x2190; VOLTAR</a>
      <a href="10-peso-visual-3.html" class="btn btn-primary">AVANCAR &#x2192;</a>
    </div>
  </div>
</body>
</html>
