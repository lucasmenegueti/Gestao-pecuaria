<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cerca - Resultado</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone-frame">
    <div class="header">
      <a href="09-cerca-2.html" class="back-btn">&#x2190;</a>
      <h1>CERCA</h1>
      <span class="step-indicator">3 de 3</span>
    </div>
    <div class="content">
      <div class="wizard-question">RESULTADO DA CERCA</div>
      <p class="text-muted mb-16">Pasto 14</p>

      <div class="result-big ok">
        <div style="font-size: 48px;">&#x26A1;</div>
        <div class="value" style="font-size: 28px;">4.500V</div>
        <div class="label">CHOQUE FORTE</div>
        <div class="fs-14" style="margin-top: 4px;">(&#x2265;4.000V)</div>
      </div>

      <div class="summary-box">
        <div class="summary-row">
          <span class="summary-label">Voltagem</span>
          <span class="summary-value">4.500V</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Classificacao</span>
          <span class="summary-value"><span class="badge ok">&#x1F7E2; FORTE</span></span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Evita mistura</span>
          <span class="summary-value text-success">&#x2705; SIM</span>
        </div>
      </div>

      <div class="card" style="background: var(--primary-light); font-size: 14px;">
        <strong>Referencia de voltagem:</strong><br>
        &#x1F7E2; Forte: &#x2265;4.000V<br>
        &#x1F7E1; Adequado: 2.000 - 3.999V<br>
        &#x1F534; Fraco: 1 - 1.999V<br>
        &#x26AA; Sem choque: 0V
      </div>

      <button class="photo-btn">&#x1F4F7; Adicionar foto (opcional)</button>
      <a href="04-menu-avaliacao.html" class="btn btn-success" style="font-size: 20px;">&#x2705; FINALIZAR</a>
    </div>
  </div>
</body>
</html>
