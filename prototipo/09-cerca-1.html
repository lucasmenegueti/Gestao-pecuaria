<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cerca - Passo 1</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone-frame">
    <div class="header">
      <a href="04-menu-avaliacao.html" class="back-btn">&#x2190;</a>
      <h1>CERCA</h1>
      <span class="step-indicator">1 de 3</span>
    </div>
    <div class="content" style="padding-bottom: 120px;">
      <div class="wizard-question">QUANTOS VOLTS NA CERCA?</div>

      <div class="slider-container">
        <span class="slider-value">4.500</span>
        <span class="slider-unit">volts</span>
      </div>
      <div class="slider-row">
        <button class="slider-btn">-</button>
        <div class="slider-track"><div class="slider-fill" style="width: 45%;"></div></div>
        <button class="slider-btn">+</button>
      </div>
      <div class="slider-labels"><span>0</span><span>10.000</span></div>

      <div style="display: flex; align-items: center; gap: 8px; margin-top: 24px; padding: 14px 16px; background: var(--card); border-radius: 12px; border: 2px solid var(--border); cursor: pointer;">
        <input type="checkbox" style="width: 22px; height: 22px;">
        <span style="font-size: 16px; font-weight: 600;">CERCA NAO ELETRICA</span>
      </div>
    </div>
    <div class="wizard-footer">
      <a href="04-menu-avaliacao.html" class="btn btn-secondary">&#x2190; VOLTAR</a>
      <a href="09-cerca-2.html" class="btn btn-primary">AVANCAR &#x2192;</a>
    </div>
  </div>
</body>
</html>
