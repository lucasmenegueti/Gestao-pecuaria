<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lavagem de Bebedouro - Passo 3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone-frame">
    <div class="header">
      <a href="18-lavagem-2.html" class="back-btn">&#x2190;</a>
      <h1>LAVAGEM DE BEBEDOURO</h1>
      <span class="step-indicator">3 de 4</span>
    </div>
    <div class="content" style="padding-bottom: 120px;">
      <div class="wizard-question">COMO ESTA O ESTADO DO BEBEDOURO?</div>
      <button class="choice-option green selected">
        <span class="icon">&#x1F7E2;</span>
        <div>
          BOM
          <div class="desc">Bebedouro limpo, sem limo ou sujeira</div>
        </div>
      </button>
      <button class="choice-option yellow">
        <span class="icon">&#x1F7E1;</span>
        <div>
          REGULAR
          <div class="desc">Pouca sujeira, limo leve nas bordas</div>
        </div>
      </button>
      <button class="choice-option red">
        <span class="icon">&#x1F534;</span>
        <div>
          RUIM
          <div class="desc">Muito sujo, limo, residuos no fundo</div>
        </div>
      </button>
    </div>
    <div class="wizard-footer">
      <a href="18-lavagem-2.html" class="btn btn-secondary">&#x2190; VOLTAR</a>
      <a href="18-lavagem-4.html" class="btn btn-primary">AVANCAR &#x2192;</a>
    </div>
  </div>
</body>
</html>
