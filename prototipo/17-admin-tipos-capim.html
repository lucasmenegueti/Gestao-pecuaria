<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Tipos de Capim</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone-frame">
    <div class="header">
      <a href="02-dashboard.html" class="back-btn">&#x2190;</a>
      <h1>Tipos de Capim</h1>
    </div>
    <div class="content">

      <div class="section-title">ADMINISTRACAO</div>
      <div class="btn-row mb-16">
        <a href="16-admin-formulacoes.html" class="btn btn-secondary btn-small">Formulacoes</a>
        <a href="17-admin-tipos-capim.html" class="btn btn-primary btn-small">Tipos de Capim</a>
      </div>

      <div class="section-title">TIPOS CADASTRADOS</div>

      <div class="card">
        <div class="flex-between">
          <div class="card-title">BRAQUIARAO</div>
          <span class="badge ok">Ativo</span>
        </div>
        <div class="card-row">&#x1F33F; Entrada ideal: <strong>&#x2265;40 cm</strong></div>
        <div class="card-row">&#x1F33F; Saida ideal: <strong>&#x2265;20 cm</strong></div>
        <div class="btn-row mt-8">
          <button class="btn btn-secondary btn-small">&#x270F;&#xFE0F; Editar</button>
          <button class="btn btn-small" style="background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger);">&#x1F5D1;&#xFE0F; Desativar</button>
        </div>
      </div>

      <div class="card">
        <div class="flex-between">
          <div class="card-title">MOMBACA</div>
          <span class="badge ok">Ativo</span>
        </div>
        <div class="card-row">&#x1F33F; Entrada ideal: <strong>&#x2265;80 cm</strong></div>
        <div class="card-row">&#x1F33F; Saida ideal: <strong>&#x2265;40 cm</strong></div>
        <div class="btn-row mt-8">
          <button class="btn btn-secondary btn-small">&#x270F;&#xFE0F; Editar</button>
          <button class="btn btn-small" style="background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger);">&#x1F5D1;&#xFE0F; Desativar</button>
        </div>
      </div>

      <div class="card">
        <div class="flex-between">
          <div class="card-title">TIFTON</div>
          <span class="badge ok">Ativo</span>
        </div>
        <div class="card-row">&#x1F33F; Entrada ideal: <strong>&#x2265;25 cm</strong></div>
        <div class="card-row">&#x1F33F; Saida ideal: <strong>&#x2265;10 cm</strong></div>
        <div class="btn-row mt-8">
          <button class="btn btn-secondary btn-small">&#x270F;&#xFE0F; Editar</button>
          <button class="btn btn-small" style="background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger);">&#x1F5D1;&#xFE0F; Desativar</button>
        </div>
      </div>

      <a href="#" class="btn btn-primary mt-24" style="font-size: 20px;">
        &#x2795; NOVO TIPO DE CAPIM
      </a>

    </div>
  </div>
</body>
</html>
